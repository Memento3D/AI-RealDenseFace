<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memento3D Head API</title>
<style>body{font:16px system-ui;background:#121a24;color:#e8edf4;max-width:1000px;margin:35px auto;padding:0 20px}h1{font-size:28px}label{display:block;margin:16px 0}input,select,button{font:inherit;padding:8px}button{cursor:pointer;background:#a5dbcb;border:0;border-radius:6px}section{background:#1d2937;padding:20px;margin:20px 0;border-radius:8px}a{color:#a2d0ff}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.muted{color:#b1bece}li{padding:5px}</style>
<h1>Memento3D · thử pipeline đầu người</h1><p>Front bắt buộc. Left/right tùy chọn; dùng để fit chung khuôn mặt RDF. TripoSR dựng đầu từ front.</p>
<p class="muted">MVP ghép mặt RDF với bề mặt tóc TripoSR trong một GLB. Chưa xác nhận độ giống hoặc sẵn sàng in.</p>
<section><form id="form"><label>Front * <input type="file" name="front" accept="image/jpeg,image/png,image/webp" required></label><label>Left <input type="file" name="left" accept="image/jpeg,image/png,image/webp"></label><label>Right <input type="file" name="right" accept="image/jpeg,image/png,image/webp"></label>
<label>Chế độ <select name="mode"><option value="mvp">MVP · mặt + tóc</option><option value="components">TripoSR + RDF (các thành phần riêng)</option><option value="raw">Chỉ TripoSR · front</option></select></label><label>Độ phân giải TripoSR <select name="resolution"><option>128</option><option>192</option><option>256</option></select></label><button id="send">Tạo job</button></form><p id="message"></p></section>
<section><h2>Job</h2><label>Job ID <input id="jobid" size="35"><button id="track" type="button">Theo dõi</button><button id="assemble" type="button">Ghép MVP từ job này</button></label><p id="state">Chưa có job.</p><ul id="artifacts"></ul><pre id="report"></pre></section><p><a href="/docs">Swagger API</a> · <a href="/health">Kiểm tra tài nguyên</a></p>
<script>
const $=s=>document.querySelector(s);let timer;
function showError(e){$('#message').textContent=e.message||String(e)}
async function poll(id){clearTimeout(timer);try{const r=await fetch('/v1/head/jobs/'+encodeURIComponent(id));const j=await r.json();if(!r.ok)throw Error(JSON.stringify(j));$('#state').textContent=j.status+(j.current_stage?' · '+j.current_stage:'');$('#report').textContent=JSON.stringify(j,null,2);$('#artifacts').replaceChildren();for(const a of j.artifacts||[]){const li=document.createElement('li'),link=document.createElement('a');link.textContent=a.path;link.href='/v1/head/jobs/'+id+'/files/'+a.path.split('/').map(encodeURIComponent).join('/');link.target='_blank';li.append(link);$('#artifacts').append(li)}if(['QUEUED','RUNNING'].includes(j.status))timer=setTimeout(()=>poll(id),2000)}catch(e){showError(e)}}
$('#form').onsubmit=async e=>{e.preventDefault();$('#send').disabled=true;try{const data=new FormData($('#form'));for(const s of ['left','right'])if(!data.get(s)?.size)data.delete(s);const r=await fetch('/v1/head/jobs',{method:'POST',body:data}),j=await r.json();if(!r.ok)throw Error(JSON.stringify(j));$('#jobid').value=j.job_id;$('#message').textContent='Đã nhận job. Có thể tiếp tục xem trạng thái sau khi tải lại trang.';poll(j.job_id)}catch(e){showError(e)}finally{$('#send').disabled=false}};
$('#track').onclick=()=>poll($('#jobid').value.trim());
$('#assemble').onclick=async()=>{try{const id=$('#jobid').value.trim(),r=await fetch('/v1/head/jobs/'+encodeURIComponent(id)+'/assemble',{method:'POST'}),j=await r.json();if(!r.ok)throw Error(JSON.stringify(j));$('#jobid').value=j.job_id;poll(j.job_id)}catch(e){showError(e)}};
</script></html>
