<style>body{margin:0;background:#171c24;color:#eee;font:16px system-ui}header{position:absolute;z-index:2;top:14px;left:18px;right:18px;pointer-events:none}nav{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}button,a{padding:9px 12px;color:#edf3ff;background:#283647;border:1px solid #52687d;border-radius:6px;text-decoration:none;cursor:pointer}p{max-width:850px;text-shadow:0 2px 4px black}canvas{display:block}#status{font-size:14px}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<header><strong>Đầu và tóc đã ghép</strong><p>Xoay bằng chuột, cuộn để phóng to. Mô hình giữ nguyên vị trí tương đối của đầu và tóc.</p><nav><button data-mode="head_with_hair.glb">Màu</button><button data-mode="geometry.glb">Hình khối</button><button data-view="front">Trước</button><button data-view="left">Trái</button><button data-view="right">Phải</button><button data-view="back">Sau</button><a href="../head_with_hair.glb" download>GLB</a><a href="../head_mm.stl" download>STL mm</a><a href="../review.html">Báo cáo</a></nav><p id="status">Đang nạp…</p></header>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#171c24');scene.add(new THREE.HemisphereLight(0xffffff,0x343b48,2));const lamp=new THREE.DirectionalLight(0xffffff,2);lamp.position.set(-.03,.05,.06);scene.add(lamp);
const camera=new THREE.PerspectiveCamera(35,1,.0001,10);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let object,center=new THREE.Vector3(),span=.03,epoch=0;
function preset(name='front'){const d={front:[0,.05,1],left:[-1,.05,.4],right:[1,.05,.4],back:[0,.05,-1]}[name];camera.position.copy(center).add(new THREE.Vector3(...d).normalize().multiplyScalar(span*2.2));controls.target.copy(center);controls.update()}
async function show(file){const request=++epoch;try{const gltf=await new GLTFLoader().loadAsync('../'+file);if(request!==epoch)return;if(object)scene.remove(object);object=gltf.scene;scene.add(object);const box=new THREE.Box3().setFromObject(object);box.getCenter(center);span=box.getSize(new THREE.Vector3()).length();preset();document.querySelector('#status').textContent='Tóc đã ở đúng hệ tọa độ của đầu. Chưa kiểm chứng resin, slicer hoặc in vật lý.';}catch(e){document.querySelector('#status').textContent='Không nạp được mô hình: '+e.message}}
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>show(b.dataset.mode);for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>preset(b.dataset.view);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});show('head_with_hair.glb');
</script>
